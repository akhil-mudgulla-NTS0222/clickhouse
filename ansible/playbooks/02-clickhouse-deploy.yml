---
- name: Deploy ClickHouse server container
  hosts: clickhouse
  gather_facts: false

  tasks:
    - name: Ensure Docker is available
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Create ClickHouse deployment directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ clickhouse_deploy_dir }}", mode: "0755" }
        - { path: "{{ clickhouse_deploy_dir }}/config.d", mode: "0755" }
        - { path: "{{ clickhouse_deploy_dir }}/users.d", mode: "0755" }

    - name: Create ClickHouse data directory for container user
      ansible.builtin.file:
        path: "{{ clickhouse_data_path }}"
        state: directory
        owner: "{{ clickhouse_container_uid }}"
        group: "{{ clickhouse_container_gid }}"
        mode: "0750"

    - name: Deploy ClickHouse configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: "../templates/config.d/network.xml.j2", dest: "{{ clickhouse_deploy_dir }}/config.d/network.xml", mode: "0644" }
        - { src: "../templates/users.d/app-user.xml.j2", dest: "{{ clickhouse_deploy_dir }}/users.d/app-user.xml", mode: "0644" }
        - { src: "../templates/compose.yml.j2", dest: "{{ clickhouse_deploy_dir }}/compose.yml", mode: "0644" }
      register: clickhouse_config_files
      no_log: true

    - name: Validate Compose configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ clickhouse_deploy_dir }}/compose.yml"
          - config
          - --quiet
      changed_when: false

    - name: Start ClickHouse container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ clickhouse_deploy_dir }}/compose.yml"
          - up
          - -d
          - --pull
          - missing
      register: clickhouse_compose_up
      changed_when: >-
        'Created' in clickhouse_compose_up.stderr or
        'Recreated' in clickhouse_compose_up.stderr or
        'Started' in clickhouse_compose_up.stderr

    - name: Recreate container when mounted configuration changes
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ clickhouse_deploy_dir }}/compose.yml"
          - up
          - -d
          - --force-recreate
      when: >-
        clickhouse_config_files.results[:2] | selectattr('changed') | list | length > 0
        and not clickhouse_compose_up.changed

    - name: Validate ClickHouse responds to SELECT 1
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ clickhouse_http_port }}/?query=SELECT%201"
        method: GET
        user: "{{ clickhouse_app_user }}"
        password: "{{ clickhouse_app_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: ch_healthcheck
      until: ch_healthcheck.status | default(0) == 200 and ch_healthcheck.content | default('') | trim == '1'
      retries: 30
      delay: 2
      changed_when: false
      no_log: true

    - name: Report validation result
      ansible.builtin.debug:
        msg: "ClickHouse {{ clickhouse_version }} is running and SELECT 1 succeeded."
