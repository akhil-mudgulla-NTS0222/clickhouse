---
# Disposable stress-test deployment only; credentials and ports are not hardened.
clickhouse_version: "24.8.14.39"
clickhouse_deploy_dir: "/opt/clickhouse-stress"
clickhouse_data_path: "/var/lib/clickhouse-stress"
# Official ClickHouse image runs as clickhouse (UID/GID 101).
clickhouse_container_uid: 101
clickhouse_container_gid: 101

# Host networking makes the container use the VM's HTTP and native ports directly.
clickhouse_listen_host: "0.0.0.0"
clickhouse_http_port: 8123
clickhouse_tcp_port: 9000

clickhouse_app_user: "stress"
clickhouse_app_password: "stress_pass"
clickhouse_nofile_limit: 262144
clickhouse_nproc_limit: 131072
