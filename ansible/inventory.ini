# ---------------------------------------------------------------------------
# Inventory for ClickHouse stress-test deployment.
#
# Fill in the connection details for your target Ubuntu host below.
# Auth is password-based with credentials HARDCODED here for a disposable lab
# box (no Vault, by design). `sshpass` is still required on the control node
# for password SSH. Because this file holds a plaintext password, keep it out
# of version control and off shared machines.
# ---------------------------------------------------------------------------

[clickhouse]
# Give the host a stable alias on the left; set the real address via ansible_host.
ch-stress-01 ansible_host=REPLACE_WITH_HOST_IP

[clickhouse:vars]
# SSH login user on the target Ubuntu host (must have sudo rights).
ansible_user=ubuntu

# SSH login password for ansible_user.
ansible_password=REPLACE_WITH_SSH_PASSWORD

# Sudo/become password. Set to the same value if the user sudos with its
# login password; remove this line entirely if the user has passwordless sudo.
ansible_become_password=REPLACE_WITH_SUDO_PASSWORD

# Target host OS interpreter; python3 is default on modern Ubuntu.
ansible_python_interpreter=/usr/bin/python3
