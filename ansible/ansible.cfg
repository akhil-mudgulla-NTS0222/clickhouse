[defaults]
# Project-local inventory so no -i flag is needed on every run.
inventory = ./inventory.ini

# Lab / stress-test context: hosts are disposable and re-provisioned often,
# so we skip interactive host-key prompts. Do NOT carry this into production.
host_key_checking = False

# Readable, structured output.
stdout_callback = yaml

# Keep facts available across plays without re-gathering on every task.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.facts_cache
fact_caching_timeout = 3600

# Fail fast and loudly during stress-test iteration.
any_errors_fatal = True
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
# Reuse SSH connections to speed up multi-task runs.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
